name: Generate articles.json

on:
  push:
    branches:
      - main
    paths:
      - "easymqtt/articles/*.md"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate articles.json
        run: python3 .github/scripts/generate_articles.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add easymqtt/articles.json
          git diff --staged --quiet || git commit -m "chore: regenerate articles.json"
          git push
